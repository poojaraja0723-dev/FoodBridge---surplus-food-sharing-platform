<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate Food | FoodBridge</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="/">Food<span>Bridge</span></a>

    <nav>
      <a href="/">Home</a>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/donate.html">Donate Food</a>
      <a href="/history.html">History</a>
      <a href="/login.html" id="authLink">Login</a>
      <button class="nav-logout hidden" id="logoutButton">Logout</button>
    </nav>
  </header>

  <main class="page-container narrow">
    <section class="page-title">
      <p class="eyebrow">MAKE A DONATION</p>
      <h1>Register surplus food</h1>
      <p class="muted">
        Please provide accurate information so volunteers can collect the food safely.
      </p>
    </section>

    <section class="form-card">
      <form id="donationForm">
        <div class="form-grid">
          <div>
            <label for="foodName">Food name</label>
            <input id="foodName" name="foodName" type="text" placeholder="Vegetable biryani" required>
          </div>

          <div>
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="">Select category</option>
              <option value="Cooked food">Cooked food</option>
              <option value="Bakery">Bakery</option>
              <option value="Fruits">Fruits</option>
              <option value="Vegetables">Vegetables</option>
              <option value="Packaged food">Packaged food</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div>
            <label for="quantity">Quantity</label>
            <input id="quantity" name="quantity" type="number" min="0.1" step="0.1" placeholder="25" required>
          </div>

          <div>
            <label for="unit">Unit</label>
            <select id="unit" name="unit" required>
              <option value="kg">Kilograms</option>
              <option value="packets">Packets</option>
              <option value="plates">Plates</option>
              <option value="items">Items</option>
              <option value="litres">Litres</option>
            </select>
          </div>

          <div>
            <label for="expiryTime">Best before / expiry time</label>
            <input id="expiryTime" name="expiryTime" type="datetime-local" required>
          </div>

          <div>
            <label for="pickupAddress">Pickup address</label>
            <input id="pickupAddress" name="pickupAddress" type="text" placeholder="Hotel or function hall address" required>
          </div>
        </div>

        <label for="description">Additional description</label>
        <textarea id="description" name="description" rows="5" placeholder="Mention packaging, dietary information or special instructions"></textarea>

        <button class="button primary" type="submit">Publish food donation</button>
      </form>

      <p id="formMessage" class="form-message"></p>
    </section>
  </main>

  <footer>
    <p>© 2026 FoodBridge. Share food. Spread hope.</p>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/donate.js"></script>
</body>
</html>
