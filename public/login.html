<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FoodBridge</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <header class="navbar">
    <a class="brand" href="/">Food<span>Bridge</span></a>
    <nav>
      <a href="/">Home</a>
      <a href="/register.html">Register</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <section class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Login to FoodBridge</h1>
      <p class="muted">Continue your food-sharing mission.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password" required>

        <button class="button primary full-width" type="submit">Login</button>
      </form>

      <p id="formMessage" class="form-message"></p>
      <p class="auth-bottom">New to FoodBridge? <a href="/register.html">Create an account</a></p>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
